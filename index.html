<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS to STL - ball-and-stick mesh exporter</title>
<style>
  :root { --bg:#1b1f24; --panel:#242a31; --line:#37404a; --text:#e6e9ed; --dim:#9aa5b1; --accent:#4aa3ff; --warn:#ffb454; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:grid; grid-template-columns:340px 1fr; height:100%; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow-y:auto; }
  h1 { font-size:17px; margin:0 0 2px; } .sub { color:var(--dim); margin:0 0 14px; font-size:12px; }
  h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:18px 0 6px; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
  input[type=number], select { width:120px; background:#161a1f; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 7px; }
  button { background:var(--accent); color:#04121f; border:0; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer; }
  button.secondary { background:#2f3943; color:var(--text); font-weight:500; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  #drop { border:1.5px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:var(--dim); }
  #drop.over { border-color:var(--accent); color:var(--text); }
  #stats div { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid #2c343d; }
  #stats span:first-child { color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12px; } td,th { text-align:left; padding:2px 4px; border-bottom:1px solid #2c343d; } th { color:var(--dim); font-weight:500; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:1px solid #0006; }
  .msg { font-size:12px; margin:6px 0; } .warn { color:var(--warn); } .err { color:var(--err); }
  main { position:relative; min-width:0; } #view { position:absolute; inset:0; }
  #hint { position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:12px; pointer-events:none; }
  @media (max-width:760px) { #app { grid-template-columns:1fr; grid-template-rows:55vh 1fr; } main { order:-1; } aside { border-right:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>BS to STL</h1>
    <p class="sub">Load an Avogadro or XBS <code>.bs</code> ball-and-stick file, preview it, export a scaled STL. Runs entirely in your browser; nothing is uploaded.</p>

    <div id="drop">Drop a <b>.bs</b> file here<br>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button id="pick">Choose file</button>
        <button id="example" class="secondary">Load acetone example</button>
        <button id="example" class="secondary">Load acetone (Avogadro)</button>
        <button id="exampleXbs" class="secondary">Load aspirin (XBS)</button>
      </div>
      <input id="file" type="file" accept=".bs,.txt,text/plain" hidden>
    </div>
    <div id="fname" class="sub" style="margin-top:6px"></div>

    <h2>Size (mm)</h2>
    <label>Carbon radius <input id="cR" type="number" value="22" min="0.1" step="0.5"></label>
    <label>Bond thickness <input id="bT" type="number" value="6" min="0.1" step="0.5"></label>
    <label>Thickness is <select id="bMode"><option value="d">diameter</option><option value="r">radius</option></select></label>
    <label>Mesh detail <select id="detail"><option value="0">Draft</option><option value="1" selected>Normal</option><option value="2">Fine</option></select></label>

    <h2>Export</h2>
    <button id="dl" disabled>Download STL</button>

    <h2>Model</h2>
    <div id="stats"></div>
    <div id="species"></div>
    <div id="msgs"></div>
  </aside>
  <main><div id="view"></div><div id="hint">drag: rotate &middot; wheel: zoom &middot; right-drag: pan</div></main>
</div>

function elementOf(label) {
  const m = /^[A-Za-z]+/.exec(label); if (!m) return 'C';
  const m = /^[A-Za-z]+/.exec(label);

function rgbToHex(r, g, b) {

  if (n.every(Number.isFinite)) { if (n.length === 1) return rgbToHex(n[0], n[0], n[0]); if (n.length >= 3) return rgbToHex(n[0], n[1], n[2]); return null; }

function wildcard(p) {
  return new RegExp('^' + p.replace(/[.^$|()\[\]{}\\?]/g, '\\$&').replace(/\*/g, '.*').replace(/\+/g, '.') + '$');
}

// XBS .bs: "atom sym x y z", "spec sym radius color...", "bonds s1 s2 min max radius color...", '*' comments. Other keywords ignored.
function parseBS(text) {
  const atoms = [], specs = new Map(), rules = [], ignored = new Map(), warnings = [];
  let explicitBonds = null, format = 'xbs';
  const lines = text.split(/\r\n|\n|\r/);

  if (tok.length < 4) return false;
  if (!/^[A-Za-z]+[0-9]*$/.test(tok[0])) return false;
  const x = Number(tok[1]), y = Number(tok[2]), z = Number(tok[3]);
  return Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z);

  // Avogadro Ball-and-Stick .bs:
  // title, atom count, then: element x y z [1-based bonded atom indices...]
  // Detect this before the XBS keyword parser because both formats use .bs.
  const meaningful = lines.map((raw, i) => ({ raw: raw.trim(), line: i + 1 }))
    .filter(x => x.raw && !x.raw.startsWith('*'));

  const looksLikeAvogadro = !hasXbsKeywords && Number.isInteger(avogadroCount) &&
    avogadroCount >= 0;

  const clean = (text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text);
  const lines = clean.split(/\r\n|\n|\r/);

  const meaningful = [];

    const t = lines[i].trim();

    const key = tok[0].toLowerCase();

      hasXbsSpecOrBonds = true;
    } else if (isAtomCoordLine(tok)) {
      hasCoordLines = true;

    atomRows.forEach((entry, i) => {
      const tok = entry.raw.split(/\s+/);
      const x = Number(tok[1]), y = Number(tok[2]), z = Number(tok[3]);
      if (tok.length < 4 || ![x, y, z].every(Number.isFinite)) {
        warnings.push('Line ' + entry.line + ': invalid Avogadro atom row ' + (i + 1) + ' skipped');

    if (/^\d+$/.test(meaningful[0].text) && isAtomCoordLine(meaningful[1].text.split(/\s+/))) {
      return 'avogadro-bs';
    }
    if (/^\d+/.test(meaningful[1].text) && meaningful.length > 2 && isAtomCoordLine(meaningful[2].text.split(/\s+/))) {

function parseXBS(text) {
  const clean = (text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text);
  const lines = clean.split(/\r\n|\n|\r/);
  const atoms = [], specs = new Map(), rules = [], ignored = new Map(), warnings = [];

    const t = raw.trim();

    if (key === 'atom') {
      const x = Number(tok[2]), y = Number(tok[3]), z = Number(tok[4]);

function parseAvogadroBS(text) {

const DETAIL = [{ nlat: 10, nlon: 20, nseg: 12 }, { nlat: 16, nlon: 32, nseg: 20 }, { nlat: 28, nlon: 56, nseg: 32 }];

function sphereTemplate(nlat, nlon) {         // unit-sphere triangles, outward CCW
function sphereTemplate(nlat, nlon) {
  const ring = [];
  for (let i = 0; i <= nlat; i++) { const t = Math.PI * i / nlat, r = []; for (let j = 0; j < nlon; j++) { const p = 2 * Math.PI * j / nlon; r.push([Math.sin(t) * Math.cos(p), Math.sin(t) * Math.sin(p), Math.cos(t)]); } ring.push(r); }

    for (let j = 0; j < nlon; j++) {

      r.push([Math.sin(t) * Math.cos(p), Math.sin(t) * Math.sin(p), Math.cos(t)]);
    }
    ring.push(r);

  for (let i = 0; i < nlat; i++) for (let j = 0; j < nlon; j++) {
    const k = (j + 1) % nlon, a = ring[i], b = ring[i + 1];
    if (i > 0) out.push(...a[j], ...b[j], ...a[k]);
    if (i < nlat - 1) out.push(...a[k], ...b[j], ...b[k]);

  stat('Input format', parsed.format === 'avogadro-bs' ? 'Avogadro / Ball-and-Stick .bs' : 'XBS .bs');
  stat('Atoms', model.atoms);
  stat('Bonds', model.bonds);
  stat('Triangles', model.nTri.toLocaleString());
  stat('Size X x Y x Z (mm)', model.size.map(v => v.toFixed(1)).join(' x '));
  stat('File units to mm', model.scale.toFixed(3) + ' (' + model.refSym + ' = ' + model.refRadius + ')');
  stat('STL size', ((84 + 50 * model.nTri) / 1048576).toFixed(2) + ' MB');

  const t = document.createElement('table'); t.innerHTML = '<tr><th>Species</th><th>Count</th><th>Radius mm</th></tr>';
  for (const s of model.species) {
    const tr = document.createElement('tr'), a = document.createElement('td'), b = document.createElement('td'), c = document.createElement('td'), sw = document.createElement('span');
    sw.className = 'sw'; sw.style.background = hex(s.color); a.append(sw, s.label); b.textContent = s.count; c.textContent = s.radiusMm.toFixed(1) + (s.fallback ? ' (est.)' : '');
    tr.append(a, b, c); t.appendChild(tr);
  }
  $('species').append(Object.assign(document.createElement('h2'), { textContent: 'Species' }), t);
  for (const w of model.warnings) msg('warn', w);
  if (model.nTri > 1500000) msg('warn', 'Very large mesh (' + model.nTri.toLocaleString() + ' triangles); consider Draft detail.');
  $('dl').disabled = false;
}

async function load(file) { text = await file.text(); name = file.name; $('fname').textContent = name; rebuild(true); }
async function load(file) {
  try {
    text = await file.text();
    name = file.name;
    $('fname').textContent = name;
    rebuild(true);
  } catch (err) {
    msg('err', 'Failed to read file: ' + err.message);
  }
}

$('pick').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) load(e.target.files[0]); };
$('example').onclick = () => { text = EXAMPLE; name = 'acetone.bs'; $('fname').textContent = 'acetone.bs (Avogadro format)'; rebuild(true); };
$('file').onchange = e => {
  if (e.target.files && e.target.files[0]) {
    load(e.target.files[0]);
    e.target.value = '';
  }
};
$('example').onclick = () => { text = EXAMPLE_ACETONE; name = 'acetone.bs'; $('fname').textContent = 'acetone.bs (Avogadro format)'; rebuild(true); };
$('exampleXbs').onclick = () => { text = EXAMPLE_ASPIRIN; name = 'aspirin.bs'; $('fname').textContent = 'aspirin.bs (XBS format)'; rebuild(true); };
for (const id of ['cR', 'bT', 'bMode', 'detail']) $(id).addEventListener('input', () => rebuild(false));
$('dl').onclick = () => {
  const blob = new Blob([writeSTL(model.pos)], { type: 'model/stl' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name.replace(/\.[^.]*$/, '') + '.stl'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
addEventListener('dragleave', () => $('drop').classList.remove('over'));
addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });
addEventListener('dragleave', e => {
  if (e.relatedTarget === null || e.target === document.documentElement) {
    $('drop').classList.remove('over');
  }
});
addEventListener('drop', e => {
  e.preventDefault();
  $('drop').classList.remove('over');
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
    load(e.dataTransfer.files[0]);
  }
});
$('example').click();
</script>
