<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS to STL - ball-and-stick mesh exporter</title>
<style>
  :root { --bg:#1b1f24; --panel:#242a31; --line:#37404a; --text:#e6e9ed; --dim:#9aa5b1; --accent:#4aa3ff; --warn:#ffb454; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:grid; grid-template-columns:340px 1fr; height:100%; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow-y:auto; }
  h1 { font-size:17px; margin:0 0 2px; } .sub { color:var(--dim); margin:0 0 14px; font-size:12px; }
  h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:18px 0 6px; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
  input[type=number], select { width:120px; background:#161a1f; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 7px; }
  button { background:var(--accent); color:#04121f; border:0; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer; }
  button.secondary { background:#2f3943; color:var(--text); font-weight:500; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  #drop { border:1.5px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:var(--dim); }
  #drop.over { border-color:var(--accent); color:var(--text); }
  #stats div { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid #2c343d; }
  #stats span:first-child { color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12px; } td,th { text-align:left; padding:2px 4px; border-bottom:1px solid #2c343d; } th { color:var(--dim); font-weight:500; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:1px solid #0006; }
  .msg { font-size:12px; margin:6px 0; } .warn { color:var(--warn); } .err { color:var(--err); }
  main { position:relative; min-width:0; } #view { position:absolute; inset:0; }
  #hint { position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:12px; pointer-events:none; }
  @media (max-width:760px) { #app { grid-template-columns:1fr; grid-template-rows:55vh 1fr; } main { order:-1; } aside { border-right:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>BS to STL</h1>
    <p class="sub">Load an Avogadro or XBS <code>.bs</code> ball-and-stick file, preview it, export a scaled STL. Runs entirely in your browser; nothing is uploaded.</p>

    <div id="drop">Drop a <b>.bs</b> file here<br>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button id="pick">Choose file</button>
        <button id="example" class="secondary">Load acetone (Avogadro)</button>
        <button id="exampleXbs" class="secondary">Load aspirin (XBS)</button>
      </div>
      <input id="file" type="file" accept=".bs,.txt,text/plain" hidden>
    </div>
    <div id="fname" class="sub" style="margin-top:6px"></div>

    <h2>Size (mm)</h2>
    <label>Carbon radius <input id="cR" type="number" value="22" min="0.1" step="0.5"></label>
    <label>Bond thickness <input id="bT" type="number" value="6" min="0.1" step="0.5"></label>
    <label>Thickness is <select id="bMode"><option value="d">diameter</option><option value="r">radius</option></select></label>
    <label>Multiple bonds <select id="bMult">
      <option value="parallel" selected>Parallel sticks</option>
      <option value="thick">Thick sticks</option>
      <option value="single">Single sticks (uniform)</option>
    </select></label>
    <label>Mesh detail <select id="detail"><option value="0">Draft</option><option value="1" selected>Normal</option><option value="2">Fine</option></select></label>

    <h2>Export</h2>
    <button id="dl" disabled>Download STL</button>

    <h2>Model</h2>
    <div id="stats"></div>
    <div id="species"></div>
    <div id="msgs"></div>
  </aside>
  <main><div id="view"></div><div id="hint">drag: rotate &middot; wheel: zoom &middot; right-drag: pan</div></main>
</div>
